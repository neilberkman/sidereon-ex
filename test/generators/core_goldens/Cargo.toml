[package]
name = "sidereon_ex_core_goldens"
version = "0.0.0"
edition = "2021"
publish = false
description = "Writes the core-derived expected values the Elixir tests compare against"

# Standalone: not a member of the NIF workspace.
[workspace]

[dependencies]
# The same exact registry requirement as native/sidereon_nif, so the goldens
# come from the core the published binding builds with.
sidereon-core = { version = "=3.0.2" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
