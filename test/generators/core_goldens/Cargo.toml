[package]
name = "sidereon_ex_core_goldens"
version = "0.0.0"
edition = "2021"
publish = false
description = "Writes the core-derived expected values the Elixir tests compare against"

# Standalone: not a member of the NIF workspace.
[workspace]

[dependencies]
# The same exact core requirement as native/sidereon_nif, so the goldens come
# from the core the binding candidate builds with.
sidereon-core = { git = "https://github.com/neilberkman/sidereon", rev = "1b66c9431b02084f39aa5ac010cd41c0cae988cd" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
