[package]
name = "sidereon_nif"
version = "3.0.4"
authors = []
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
exact-cache-test-failpoints = ["sidereon-core/exact-cache-test-failpoints"]

[dependencies]
rustler = "0.37.3"
chrono = "0.4"
serde_json = "1"
sidereon-core = { version = "=3.0.4", features = ["mmap"] }
sidereon = "=3.0.4"
trust-region-least-squares = "=0.11.0"
# Same major.minor as sidereon-core so the shared `DMatrix`/`DVector` types
# unify across crates for the covariance/least-squares marshalling.
nalgebra = "0.33"
