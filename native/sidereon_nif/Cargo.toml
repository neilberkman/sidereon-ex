[package]
name = "sidereon_nif"
version = "0.12.0"
authors = []
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
exact-cache-test-failpoints = ["sidereon-core/exact-cache-test-failpoints"]

[dependencies]
rustler = "0.37.3"
chrono = "0.4"
serde_json = "1"
sidereon-core = { version = "=0.40.0", features = ["mmap"] }
sidereon = "=0.40.0"
trust-region-least-squares = "0.9.1"
# Same major.minor as sidereon-core so the shared `DMatrix`/`DVector` types
# unify across crates for the covariance/least-squares marshalling.
nalgebra = "0.33"
