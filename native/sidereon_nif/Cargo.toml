[package]
name = "sidereon_nif"
version = "3.0.0"
authors = []
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
exact-cache-test-failpoints = ["sidereon-core/exact-cache-test-failpoints"]

[dependencies]
rustler = "0.37.3"
chrono = "0.4"
serde_json = "1"
sidereon-core = { version = "3.0.0", git = "https://github.com/neilberkman/sidereon", rev = "e2fb3dfdc392d23087ed8aa1ee028a0056b4021b", features = ["mmap"] }
sidereon = { version = "3.0.0", git = "https://github.com/neilberkman/sidereon", rev = "e2fb3dfdc392d23087ed8aa1ee028a0056b4021b" }
trust-region-least-squares = { version = "0.11.0", git = "https://github.com/neilberkman/sidereon", rev = "e2fb3dfdc392d23087ed8aa1ee028a0056b4021b" }
# Same major.minor as sidereon-core so the shared `DMatrix`/`DVector` types
# unify across crates for the covariance/least-squares marshalling.
nalgebra = "0.33"
