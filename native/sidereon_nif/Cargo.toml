[package]
name = "sidereon_nif"
version = "3.0.2"
authors = []
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
exact-cache-test-failpoints = ["sidereon-core/exact-cache-test-failpoints"]

[dependencies]
rustler = "0.37.3"
chrono = "0.4"
serde_json = "1"
sidereon-core = { version = "=3.0.2", git = "https://github.com/neilberkman/sidereon", rev = "2025d853d9cb08cb1367166fa09e594bec6aa7f6", features = ["mmap"] }
sidereon = { version = "=3.0.2", git = "https://github.com/neilberkman/sidereon", rev = "2025d853d9cb08cb1367166fa09e594bec6aa7f6" }
trust-region-least-squares = { version = "=0.11.0", git = "https://github.com/neilberkman/sidereon", rev = "2025d853d9cb08cb1367166fa09e594bec6aa7f6" }
# Same major.minor as sidereon-core so the shared `DMatrix`/`DVector` types
# unify across crates for the covariance/least-squares marshalling.
nalgebra = "0.33"
