# Temporary 3.0.2 publication recovery; remove after the release is published.
name: Recover reviewed Hex 3.0.2 artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-docs:
    name: Build exact-tag package and reviewed docs overlay
    runs-on: ubuntu-22.04
    env:
      PACKAGE_TAG: v3.0.2
      PACKAGE_TAG_COMMIT: 94570c271e44f518e46c7fd05132d760f0e1df04
      SIDEREON_BUILD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 94570c271e44f518e46c7fd05132d760f0e1df04
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact immutable release tag
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$(git rev-parse HEAD)" = "$PACKAGE_TAG_COMMIT"
          test "$(git rev-list -n 1 "$PACKAGE_TAG")" = "$PACKAGE_TAG_COMMIT"
          test "$(awk -F '"' '/@version/ { print $2; exit }' mix.exs)" = 3.0.2
          grep -q -- '-v3.0.2-' checksum-Elixir.Sidereon.NIF.exs
          test "$(grep -c -- '=> "sha256:' checksum-Elixir.Sidereon.NIF.exs)" -eq 9
          if rg -n '(^|[,{[:space:]])(git|path)[[:space:]]*=' \
            native/sidereon_nif/Cargo.toml test/generators/core_goldens/Cargo.toml; then
            echo "release manifests still contain a Git or path dependency" >&2
            exit 1
          fi
          test -z "$(git status --short)"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Install pinned Hex and Rebar
        run: |
          mix local.hex 2.5.1 --force
          mix local.rebar --force

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/sidereon_nif
          shared-key: release-3.0.2-hex-docs
          cache-on-failure: true

      - name: Build the package from the clean immutable tag
        shell: bash
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          test -z "$(git status --short --untracked-files=no)"
          mkdir -p dist
          mix hex.build --output dist/sidereon-3.0.2.tar
          test -s dist/sidereon-3.0.2.tar
          sha256sum dist/sidereon-3.0.2.tar > dist/PACKAGE-TAG-SHA256
          test -z "$(git status --short --untracked-files=no)"

      - name: Apply the reviewed documentation-only overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "lib/sidereon/constellation.ex": [
                  (
                      "`Sidereon.Coverage.look_angle_error/0` value.",
                      "`t:Sidereon.Coverage.look_angle_error/0` value.",
                  )
              ],
              "lib/sidereon/gnss/observables.ex": [
                  (
                      "          Types.ecef_input(),",
                      "          {number(), number(), number()} | %{x_m: number(), y_m: number(), z_m: number()},",
                  )
              ],
              "lib/sidereon/terrain/mmap_terrain.ex": [
                  (
                      "    its source path, original message, and complete nested `Sidereon.Terrain.tile_error/0`.",
                      "    its source path, original message, and complete nested\n"
                      "    `t:Sidereon.Terrain.tile_error/0`.",
                  )
              ],
          }

          for name, edits in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected exactly one reviewed docs match in {name}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          git diff --binary -- \
            lib/sidereon/constellation.ex \
            lib/sidereon/gnss/observables.ex \
            lib/sidereon/terrain/mmap_terrain.ex \
            > dist/DOCS-ONLY-OVERLAY.patch
          git diff --name-only | sort > dist/DOCS-OVERLAY-FILES.txt
          cat > /tmp/expected-docs-overlay-files.txt <<'FILES'
          lib/sidereon/constellation.ex
          lib/sidereon/gnss/observables.ex
          lib/sidereon/terrain/mmap_terrain.ex
          FILES
          diff -u /tmp/expected-docs-overlay-files.txt dist/DOCS-OVERLAY-FILES.txt
          test -s dist/DOCS-ONLY-OVERLAY.patch

      - name: Build warning-clean documentation from the reviewed overlay
        shell: bash
        run: |
          mix docs --warnings-as-errors
          test -s doc/index.html
          sha256sum -c dist/PACKAGE-TAG-SHA256
          (
            cd "$RUNNER_TEMP"
            mix run --no-mix-exs -e '
            Hex.start()
            Code.ensure_loaded!(:mix_hex_tarball)

            File.cd!(System.fetch_env!("GITHUB_WORKSPACE"), fn ->
              files =
                "doc/**"
                |> Path.wildcard()
                |> Enum.filter(&File.regular?/1)
                |> Enum.map(fn path ->
                  {path |> Path.relative_to("doc") |> String.to_charlist(), File.read!(path)}
                end)

              {:ok, archive} = :mix_hex_tarball.create_docs(files)
              File.write!("dist/sidereon-3.0.2-docs.tar.gz", archive)
            end)
            '
          )

      - name: Verify and inventory the exact review artifacts
        shell: bash
        run: |
          test -s dist/sidereon-3.0.2.tar
          test -s dist/sidereon-3.0.2-docs.tar.gz
          test "$(stat -c %s dist/sidereon-3.0.2.tar)" -le 8388608
          test "$(stat -c %s dist/sidereon-3.0.2-docs.tar.gz)" -le 8388608
          sha256sum -c dist/PACKAGE-TAG-SHA256

          (
            cd "$RUNNER_TEMP"
            mix run --no-mix-exs -e '
            Hex.start()
            Code.ensure_loaded!(:mix_hex_tarball)

            File.cd!(System.fetch_env!("GITHUB_WORKSPACE"), fn ->
              result = Hex.Tar.unpack!("dist/sidereon-3.0.2.tar", :memory)
              unless result.inner_checksum && result.outer_checksum && result.contents do
                raise "Hex package checksum verification failed"
              end

              name = result.metadata[:name] || result.metadata["name"]
              version = result.metadata[:version] || result.metadata["version"]
              unless to_string(name) == "sidereon" && to_string(version) == "3.0.2" do
                raise "unexpected package identity #{inspect(name)} #{inspect(version)}"
              end

              names = Enum.map(result.contents, fn entry -> entry |> elem(0) |> to_string() end)
              unpacked_bytes = Enum.reduce(result.contents, 0, fn entry, total -> total + byte_size(elem(entry, 1)) end)
              if unpacked_bytes > 67_108_864, do: raise("unpacked package exceeds 64 MiB")
              File.write!("dist/PACKAGE-CONTENTS.txt", Enum.join(Enum.sort(names), "\n") <> "\n")

              {:ok, docs} =
                :mix_hex_tarball.unpack_docs(
                  File.read!("dist/sidereon-3.0.2-docs.tar.gz"),
                  :memory
                )

              docs_bytes = Enum.reduce(docs, 0, fn {_name, body}, total -> total + byte_size(body) end)
              if docs_bytes > 67_108_864, do: raise("unpacked docs exceeds 64 MiB")
              docs_names = Enum.map(docs, fn {entry_name, _body} -> to_string(entry_name) end)
              File.write!("dist/DOCS-CONTENTS.txt", Enum.join(Enum.sort(docs_names), "\n") <> "\n")
            end)
            '
          )
          grep -Fxq mix.exs dist/PACKAGE-CONTENTS.txt
          grep -Fxq checksum-Elixir.Sidereon.NIF.exs dist/PACKAGE-CONTENTS.txt
          grep -Fxq THIRD-PARTY-NOTICES.md dist/PACKAGE-CONTENTS.txt
          grep -Fxq native/sidereon_nif/Cargo.lock dist/PACKAGE-CONTENTS.txt
          grep -Fxq index.html dist/DOCS-CONTENTS.txt

          (
            cd dist
            sha256sum sidereon-3.0.2.tar sidereon-3.0.2-docs.tar.gz > SHA256SUMS
          )
          overlay_sha="$(sha256sum dist/DOCS-ONLY-OVERLAY.patch | cut -d ' ' -f 1)"
          package_sha="$(sha256sum dist/sidereon-3.0.2.tar | cut -d ' ' -f 1)"
          docs_sha="$(sha256sum dist/sidereon-3.0.2-docs.tar.gz | cut -d ' ' -f 1)"
          hex_version="$(cd "$RUNNER_TEMP" && mix run --no-mix-exs -e 'Hex.start(); IO.write(Hex.version())')"
          {
            echo "package_tag=$PACKAGE_TAG"
            echo "package_tag_commit=$PACKAGE_TAG_COMMIT"
            echo "package_sha256=$package_sha"
            echo "docs_source_base_commit=$PACKAGE_TAG_COMMIT"
            echo "docs_overlay_patch_sha256=$overlay_sha"
            echo "docs_sha256=$docs_sha"
            echo "workflow_source_commit=$GITHUB_SHA"
            echo "elixir=$(elixir --version | tail -1)"
            echo "hex=$hex_version"
            wc -c dist/sidereon-3.0.2.tar dist/sidereon-3.0.2-docs.tar.gz
          } > dist/BUILD-IDENTITY.txt

      - name: Upload reviewed publication inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidereon-hex-3.0.2-recovery-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/sidereon-3.0.2.tar
            dist/sidereon-3.0.2-docs.tar.gz
            dist/SHA256SUMS
            dist/PACKAGE-TAG-SHA256
            dist/PACKAGE-CONTENTS.txt
            dist/DOCS-CONTENTS.txt
            dist/DOCS-ONLY-OVERLAY.patch
            dist/DOCS-OVERLAY-FILES.txt
            dist/BUILD-IDENTITY.txt
