name: Publish to Hex

# Publishes the package and its documentation to Hex from a clean checkout of
# the release tag.
#
# Hex trusted publishing: hex.pm holds a workload identity for this
# repository, this workflow file and the `release` environment. With no Hex
# key set, `mix hex.publish` exchanges the job's GitHub OIDC token for a token
# that can only publish this package. Staged publishing is enabled for the
# package, so the release waits on hex.pm until an owner approves it.
#
# The `release` environment accepts only tags matching `v*`, so a branch or a
# pull request cannot obtain the token.
#
# The workflow runs when a version tag is pushed. The precompiled NIFs are
# built from the release branch beforehand and their checksums committed, so
# the tag is pushed once, on the checksum-complete commit; the first step
# refuses any other commit. It can also be started by hand on a tag to retry
# a failed run.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Full release commit SHA the tag must point at (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish package and docs
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      SIDEREON_BUILD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require the checksum-complete release tag
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_commit || '' }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ -n "$EXPECTED_COMMIT" ]; then
            test "${#EXPECTED_COMMIT}" -eq 40
            test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          fi
          version="$(awk -F '"' '/@version/ { print $2; exit }' mix.exs)"
          test "v${version}" = "$GITHUB_REF_NAME"
          grep -q -- "-v${version}-" checksum-Elixir.Sidereon.NIF.exs
          test "$(grep -c -- '=> "sha256:' checksum-Elixir.Sidereon.NIF.exs)" -eq 9
          test "$(grep -c -- "-v${version}-" checksum-Elixir.Sidereon.NIF.exs)" -eq 9
          if grep -nE '(^|[,{[:space:]])(git|path)[[:space:]]*=' \
            native/sidereon_nif/Cargo.toml test/generators/core_goldens/Cargo.toml; then
            echo "release manifests still contain a Git or path dependency" >&2
            exit 1
          fi

      # The commit was pushed to main before it was tagged, so CI has already
      # run on it. Require that run's success instead of running the suite a
      # second time.
      - name: Require a successful CI run for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"
            if jq -e '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")] | length > 0' <<<"$runs" >/dev/null; then
              echo "CI succeeded on main for ${GITHUB_SHA}"
              exit 0
            fi
            if jq -e '[.workflow_runs[] | select(.head_branch == "main" and .status != "completed")] | length > 0' <<<"$runs" >/dev/null; then
              echo "attempt ${attempt}: CI is still running for ${GITHUB_SHA}"
              sleep 30
              continue
            fi
            echo "no successful CI run on main for ${GITHUB_SHA}" >&2
            exit 1
          done
          echo "CI did not finish for ${GITHUB_SHA}" >&2
          exit 1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.3"
          elixir-version: "1.19.4"

      - name: Install pinned Hex and Rebar
        run: |
          mix local.hex 2.7.0 --force
          mix local.rebar --force

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1

      - name: Fetch dependencies and compile
        run: |
          mix deps.get
          mix compile --warnings-as-errors

      - name: Publish package and docs
        shell: bash
        run: |
          if [ -n "${HEX_API_KEY:-}" ]; then
            echo "HEX_API_KEY is set; this workflow publishes with its workload identity only" >&2
            exit 1
          fi
          mix hex.publish --yes
