# Temporary release preparation workflow; remove before the final merge.
name: Prepare 3.0.2 core goldens

on:
  push:
    branches:
      - release/3.0.2-20261005
    paths:
      - '.github/workflows/release-prepare-3.0.2.yml'
      - 'test/generators/core_goldens/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-goldens:
    name: Regenerate exact-core golden fixtures
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: test/generators/core_goldens
          shared-key: release-3.0.2-core-goldens

      - name: Validate the locked core source and snapshot committed fixtures
        env:
          SIDEREON_CORE_REV: 47eaf24e39afa71168670664e88361ed41011bc2
        run: |
          cargo metadata \
            --locked \
            --format-version 1 \
            --manifest-path test/generators/core_goldens/Cargo.toml \
            > /tmp/core-goldens-metadata.json
          python3 - <<'PY'
          import json
          import os

          revision = os.environ["SIDEREON_CORE_REV"]
          expected_source = (
              "git+https://github.com/neilberkman/sidereon"
              f"?rev={revision}#{revision}"
          )
          with open("/tmp/core-goldens-metadata.json", encoding="utf-8") as handle:
              metadata = json.load(handle)
          core = [package for package in metadata["packages"] if package["name"] == "sidereon-core"]
          if len(core) != 1:
              raise SystemExit(f"expected one locked sidereon-core package, found {len(core)}")
          if core[0]["version"] != "3.0.2" or core[0]["source"] != expected_source:
              raise SystemExit(
                  "locked sidereon-core does not match the declared 3.0.2 candidate revision"
              )
          PY

          cat > /tmp/core-golden-files.txt <<'EOF'
          test/fixtures/core_goldens/constellation_visibility.json
          test/fixtures/core_goldens/doppler_solve.json
          test/fixtures/core_goldens/fusion_tight_sp3.json
          test/fixtures/core_goldens/rtk_reference_station_wtzr_wtzz.json
          test/fixtures/core_goldens/spp_trace_L2_tropo.json
          test/fixtures/core_goldens/static_solve.json
          test/fixtures/scenario/g01_two_epochs_expected.json
          EOF
          while IFS= read -r golden; do
            mkdir -p "/tmp/core-goldens-before/$(dirname "$golden")"
            cp "$golden" "/tmp/core-goldens-before/$golden"
          done < /tmp/core-golden-files.txt

      - name: Generate fixtures from the locked core candidate
        env:
          SIDEREON_CORE_REV: 47eaf24e39afa71168670664e88361ed41011bc2
        run: |
          cargo run \
            --locked \
            --release \
            --manifest-path test/generators/core_goldens/Cargo.toml \
            -- test/fixtures

      - name: Verify producer identity and unchanged numerical content
        env:
          SIDEREON_CORE_REV: 47eaf24e39afa71168670664e88361ed41011bc2
        run: |
          git diff --binary -- \
            test/fixtures/core_goldens \
            test/fixtures/scenario/g01_two_epochs_expected.json \
            > core-goldens-3.0.2.patch

          python3 - <<'PY'
          import json
          import os

          revision = os.environ["SIDEREON_CORE_REV"]
          with open("/tmp/core-golden-files.txt", encoding="utf-8") as handle:
              paths = [line.strip() for line in handle if line.strip()]
          if len(paths) != 7:
              raise SystemExit(f"expected 7 golden paths, found {len(paths)}")

          changed = []
          for path in paths:
              with open(f"/tmp/core-goldens-before/{path}", encoding="utf-8") as handle:
                  before = json.load(handle)
              with open(path, encoding="utf-8") as handle:
                  after = json.load(handle)
              source = after.pop("source", None)
              before.pop("source", None)
              if not isinstance(source, str) or not source.startswith(f"sidereon-core {revision} "):
                  raise SystemExit(f"{path}: generated source does not name locked core revision")
              if before != after:
                  changed.append(path)

          if changed:
              raise SystemExit(
                  "generated content changed outside source provenance: " + ", ".join(changed)
              )
          PY

      - name: Upload regenerated fixtures and patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidereon-elixir-core-goldens-3.0.2-${{ github.sha }}
          path: |
            test/fixtures/core_goldens/*.json
            test/fixtures/scenario/g01_two_epochs_expected.json
            core-goldens-3.0.2.patch
