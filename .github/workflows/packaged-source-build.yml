name: Packaged source build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  packaged-source-build:
    name: Hex tarball / forced Rust source build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.3"
          elixir-version: "1.19.4"

      - name: Install Hex
        run: mix local.hex 2.5.1 --force

      - name: Build package and force its source-build path
        run: bash .github/scripts/check-packaged-source-build.sh
