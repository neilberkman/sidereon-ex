name: Precompiled NIFs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rebuild_existing_assets:
        description: "Rebuild and replace assets even if this tag already has release archives"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # The full CI bar (format, credo, the Elixir suite across the OTP matrix),
  # run against the tagged commit. The release path previously ran only the
  # packaged-source-build gate, so a tag could ship assets from a commit that
  # had never passed the rest.
  gate:
    uses: ./.github/workflows/ci.yml

  packaged-source-build:
    name: Packaged source-build release gate
    uses: ./.github/workflows/packaged-source-build.yml

  asset-check:
    name: Check release assets
    runs-on: ubuntu-22.04
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Check whether this tag already has release archives
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REBUILD_EXISTING_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_existing_assets || false }}
        run: |
          if [[ "$REBUILD_EXISTING_ASSETS" == "true" ]]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          asset_count="$(gh release view "$REF_NAME" --repo "$REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          if [[ "$asset_count" -gt 0 ]]; then
            echo "Release $REF_NAME already has $asset_count assets; skipping rebuild."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No existing assets found for $REF_NAME; building precompiled NIFs."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  precompile:
    name: ${{ matrix.nif }} / ${{ matrix.job.target }}${{ matrix.job.variant && format(' ({0})', matrix.job.variant) || '' }}
    needs: [asset-check, packaged-source-build, gate]
    if: needs.asset-check.outputs.should-build == 'true'
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true }
          # musl NIFs must link the C runtime dynamically: Rust defaults to
          # +crt-static on musl, and a static-crt object cannot be dlopen'd
          # as a NIF (loads would fail at :erlang.load_nif/2).
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            use-cross: true
            rustflags: "-C target-feature=-crt-static"
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            use-cross: true
            rustflags: "-C target-feature=-crt-static"
          # :portable variant rows: zig-linked with a glibc 2.17 floor so
          # the artifact is self-contained on old-glibc hosts and in
          # zig-based packaging pipelines. Consumers opt in at compile time
          # (SIDEREON_PORTABLE_NIF=1 / config :sidereon, portable_nif: true).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            variant: portable
            zig-glibc: "2.17"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            variant: portable
            zig-glibc: "2.17"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract project version
        shell: bash
        run: |
          version="$(awk -F '"' '/@version/ { print $2; exit }' mix.exs)"
          test -n "$version"
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.92.0
          target: ${{ matrix.job.target }}

      # Per-target cache: the dependency graph rarely changes between
      # releases, so release N+1's legs restore N's compilation. The key
      # includes target and variant because artifacts are not interchangeable
      # across them.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/sidereon_nif
          shared-key: nif-${{ matrix.job.target }}${{ matrix.job.variant && format('-{0}', matrix.job.variant) || '' }}

      - name: Install cargo-zigbuild
        if: ${{ matrix.job.zig-glibc }}
        shell: bash
        run: pip3 install cargo-zigbuild==0.23.0

      - name: Install cross
        if: ${{ matrix.job.use-cross }}
        shell: bash
        run: |
          cargo install cross \
            --git https://github.com/cross-rs/cross \
            --rev 1d07d3f9cc465c435256f1aabc1d18024517891a \
            --locked

      - name: Build NIF
        shell: bash
        env:
          RUSTLER_NIF_VERSION: ${{ matrix.nif }}
          RUSTFLAGS: ${{ matrix.job.rustflags }}
        run: |
          tool=cargo
          subcommand=build
          target_arg="${{ matrix.job.target }}"
          if [[ "${{ matrix.job.use-cross || false }}" == "true" ]]; then
            tool=cross
          fi
          if [[ -n "${{ matrix.job.zig-glibc || '' }}" ]]; then
            tool=cargo-zigbuild
            subcommand=zigbuild
            target_arg="${{ matrix.job.target }}.${{ matrix.job.zig-glibc }}"
          fi

          "$tool" "$subcommand" \
            --manifest-path native/sidereon_nif/Cargo.toml \
            --target "$target_arg" \
            --release \
            --locked

      - name: Package NIF archive
        id: package-nif
        shell: bash
        run: |
          target="${{ matrix.job.target }}"
          nif="${{ matrix.nif }}"
          lib_prefix="lib"
          source_ext="so"
          final_ext="so"

          case "$target" in
            *-pc-windows-*)
              lib_prefix=""
              source_ext="dll"
              final_ext="dll"
              ;;
            *-apple-darwin)
              source_ext="dylib"
              final_ext="so"
              ;;
          esac

          variant_suffix=""
          if [[ -n "${{ matrix.job.variant || '' }}" ]]; then
            variant_suffix="--${{ matrix.job.variant }}"
          fi

          source_lib="target/${target}/release/${lib_prefix}sidereon_nif.${source_ext}"
          final_lib="${lib_prefix}sidereon_nif-v${PROJECT_VERSION}-nif-${nif}-${target}${variant_suffix}.${final_ext}"
          archive="${final_lib}.tar.gz"

          test -f "$source_lib"
          test -f LICENSE
          test -f LICENSES/Apache-2.0.txt
          test -f LICENSES/ERFA-BSD-3-Clause.txt
          test -f LICENSES/IERS-Conventions-Software-License.txt
          test -f LICENSES/ISC-libloading.txt
          test -f LICENSES/SciPy-BSD-3-Clause.txt
          test -f THIRD-PARTY-NOTICES.md
          test -f third_party_source/sidereon-core-0.35.0/tides/mod.rs
          test -f third_party_source/sidereon-core-0.35.0/tides/ocean.rs
          test -f third_party_source/sidereon-core-0.35.0/tides/pole.rs
          rm -f "$final_lib" "$archive"
          cp "$source_lib" "$final_lib"
          tar -czf "$archive" \
            "$final_lib" \
            LICENSE \
            LICENSES/Apache-2.0.txt \
            LICENSES/ERFA-BSD-3-Clause.txt \
            LICENSES/IERS-Conventions-Software-License.txt \
            LICENSES/ISC-libloading.txt \
            LICENSES/SciPy-BSD-3-Clause.txt \
            THIRD-PARTY-NOTICES.md \
            third_party_source/sidereon-core-0.35.0/tides/mod.rs \
            third_party_source/sidereon-core-0.35.0/tides/ocean.rs \
            third_party_source/sidereon-core-0.35.0/tides/pole.rs

          archive_listing="$(tar -tzf "$archive")"
          grep -Fxq "$final_lib" <<<"$archive_listing"
          grep -Fxq "LICENSE" <<<"$archive_listing"
          grep -Fxq "LICENSES/Apache-2.0.txt" <<<"$archive_listing"
          grep -Fxq "LICENSES/ERFA-BSD-3-Clause.txt" <<<"$archive_listing"
          grep -Fxq "LICENSES/IERS-Conventions-Software-License.txt" <<<"$archive_listing"
          grep -Fxq "LICENSES/ISC-libloading.txt" <<<"$archive_listing"
          grep -Fxq "LICENSES/SciPy-BSD-3-Clause.txt" <<<"$archive_listing"
          grep -Fxq "THIRD-PARTY-NOTICES.md" <<<"$archive_listing"
          grep -Fxq "third_party_source/sidereon-core-0.35.0/tides/mod.rs" <<<"$archive_listing"
          grep -Fxq "third_party_source/sidereon-core-0.35.0/tides/ocean.rs" <<<"$archive_listing"
          grep -Fxq "third_party_source/sidereon-core-0.35.0/tides/pole.rs" <<<"$archive_listing"
          test "$(wc -l <<<"$archive_listing" | tr -d ' ')" -eq 11

          if command -v sha256sum >/dev/null 2>&1; then
            sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          else
            sha="$(shasum -a 256 "$archive" | cut -d ' ' -f 1)"
          fi

          echo "file-name=$archive" >> "$GITHUB_OUTPUT"
          echo "file-path=$archive" >> "$GITHUB_OUTPUT"
          echo "file-sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Built $archive"
          echo "SHA256 $sha"

      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package-nif.outputs.file-name }}
          path: ${{ steps.package-nif.outputs.file-path }}

  publish-release-assets:
    name: Publish release assets
    needs: [asset-check, packaged-source-build, gate, precompile]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/') && needs.asset-check.outputs.should-build == 'true'
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Attach archives to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/**/*.tar.gz

  load-smoke:
    name: Load smoke / ${{ matrix.target }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }}
    needs: [asset-check, packaged-source-build, gate, publish-release-assets]
    # Runs on the initial tag push (after assets publish) AND on the moved
    # tag after the checksum commit, when builds are skipped: an artifact
    # with the wrong linkage (static crt on musl, too-new glibc floor on the
    # portable variant) builds and checksums fine and only fails at
    # :erlang.load_nif/2, so checksummed assets are not evidence of a
    # loadable NIF. Boot each artifact in a stock image via the consumer
    # install path and dispatch one call through it.
    if: startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled()
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            image: hexpm/elixir:1.20.3-erlang-28.4.3-alpine-3.23.5
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            image: hexpm/elixir:1.20.3-erlang-28.4.3-alpine-3.23.5
          - target: x86_64-unknown-linux-gnu
            variant: portable
            os: ubuntu-22.04
            image: hexpm/elixir:1.20.3-erlang-28.4.3-debian-bullseye-20260803
            max-glibc: "2.17"
          - target: aarch64-unknown-linux-gnu
            variant: portable
            os: ubuntu-24.04-arm
            image: hexpm/elixir:1.20.3-erlang-28.4.3-debian-bullseye-20260803
            max-glibc: "2.17"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Stage a consumer-shaped checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
          MAX_GLIBC: ${{ matrix.max-glibc }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(awk -F '"' '/@version/ { print $2; exit }' mix.exs)"
          test -n "$version"
          flavor="${TARGET}${VARIANT:+--$VARIANT}"
          asset="libsidereon_nif-v${version}-nif-2.15-${flavor}.so.tar.gz"
          gh release download "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --dir /tmp/asset
          sha="$(sha256sum "/tmp/asset/$asset" | cut -d ' ' -f 1)"
          printf '%%{\n  "%s" => "sha256:%s"\n}\n' "$asset" "$sha" \
            > checksum-Elixir.Sidereon.NIF.exs

          if [[ -n "$MAX_GLIBC" ]]; then
            mkdir -p /tmp/asset/ext
            tar -xzf "/tmp/asset/$asset" -C /tmp/asset/ext
            ceiling="$(readelf --dyn-syms "/tmp/asset/ext/libsidereon_nif-v${version}-nif-2.15-${flavor}.so" \
              | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
            echo "glibc symbol ceiling: $ceiling (floor promise: $MAX_GLIBC)"
            test "$ceiling" = "GLIBC_${MAX_GLIBC}"
          fi

          # Consumers install from a hex tarball: no .git, current checksum
          # file. A .git dir or a stale checksum flips the NIF to
          # force_build, which would smoke-test a source build instead of
          # the published artifact.
          rm -rf .git

      - name: Load the precompiled NIF and call it
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cat > /tmp/smoke.sh <<'SMOKE'
          set -e
          export HOME=/root MIX_ENV=prod
          mix local.hex --force
          mix local.rebar --force
          cd /work
          mix deps.get
          mix compile
          ls _build/prod/lib/sidereon/priv/native/ | grep -F "$FLAVOR"
          mix run -e '
          case Sidereon.CCSDS.CDM.parse_kvn("") do
            {:error, _} ->
              IO.puts("SMOKE OK: precompiled NIF loaded, call dispatched into Rust and back")

            other ->
              IO.puts("SMOKE UNEXPECTED: #{inspect(other)}")
              System.halt(1)
          end'
          SMOKE
          docker run --rm \
            -e FLAVOR="${TARGET}${VARIANT:+--$VARIANT}" \
            -e SIDEREON_PORTABLE_NIF="${VARIANT:+1}" \
            -v "$PWD":/work -v /tmp/smoke.sh:/smoke.sh \
            "${{ matrix.image }}" \
            sh /smoke.sh

  checksum-asset-parity:
    name: Checksum / asset parity
    needs: [asset-check, load-smoke]
    # A checksum entry with no matching release asset fails at the *user's*
    # compile time with a download error, which is a worse experience than
    # compiling from source. Verify the two sets agree before anyone consumes
    # the tag.
    if: startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every checksum triple has a published asset, and vice versa
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Two-stage release: the first tag push builds and publishes the
          # assets, and the checksum file is only committed afterwards, with the
          # tag moved onto that commit. So on the first pass the checksum file
          # still describes the previous version and cannot match - the pairing
          # is only meaningful once the file names this version.
          version="$(awk -F '"' '/@version/ { print $2; exit }' mix.exs)"
          if ! grep -q -- "-v${version}-" checksum-Elixir.Sidereon.NIF.exs; then
            echo "checksum file does not describe ${version} yet; this is the " \
                 "asset-publishing pass of the two-stage release. The pairing " \
                 "is enforced on the moved tag."
            exit 0
          fi

          gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > /tmp/assets.txt
          grep -oE '"[^"]+\.tar\.gz"' checksum-Elixir.Sidereon.NIF.exs \
            | tr -d '"' | sort > /tmp/checksums.txt

          echo "assets:    $(wc -l < /tmp/assets.txt)"
          echo "checksums: $(wc -l < /tmp/checksums.txt)"

          if ! diff -u /tmp/checksums.txt /tmp/assets.txt; then
            echo "::error::checksum file and published assets disagree" >&2
            exit 1
          fi
