name: Precompiled NIFs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rebuild_existing_assets:
        description: "Rebuild and replace assets even if this tag already has release archives"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  packaged-source-build:
    name: Packaged source-build release gate
    uses: ./.github/workflows/packaged-source-build.yml

  asset-check:
    name: Check release assets
    runs-on: ubuntu-22.04
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Check whether this tag already has release archives
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REBUILD_EXISTING_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_existing_assets || false }}
        run: |
          if [[ "$REBUILD_EXISTING_ASSETS" == "true" ]]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          asset_count="$(gh release view "$REF_NAME" --repo "$REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          if [[ "$asset_count" -gt 0 ]]; then
            echo "Release $REF_NAME already has $asset_count assets; skipping rebuild."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No existing assets found for $REF_NAME; building precompiled NIFs."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  precompile:
    name: ${{ matrix.nif }} / ${{ matrix.job.target }}
    needs: [asset-check, packaged-source-build]
    if: needs.asset-check.outputs.should-build == 'true'
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract project version
        shell: bash
        run: |
          version="$(awk -F '"' '/@version/ { print $2; exit }' mix.exs)"
          test -n "$version"
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.92.0
          target: ${{ matrix.job.target }}

      - name: Install cross
        if: ${{ matrix.job.use-cross }}
        shell: bash
        run: |
          cargo install cross \
            --git https://github.com/cross-rs/cross \
            --rev 1d07d3f9cc465c435256f1aabc1d18024517891a \
            --locked

      - name: Build NIF
        shell: bash
        env:
          RUSTLER_NIF_VERSION: ${{ matrix.nif }}
        run: |
          tool=cargo
          if [[ "${{ matrix.job.use-cross || false }}" == "true" ]]; then
            tool=cross
          fi

          "$tool" build \
            --manifest-path native/sidereon_nif/Cargo.toml \
            --target "${{ matrix.job.target }}" \
            --release \
            --locked

      - name: Package NIF archive
        id: package-nif
        shell: bash
        run: |
          target="${{ matrix.job.target }}"
          nif="${{ matrix.nif }}"
          lib_prefix="lib"
          source_ext="so"
          final_ext="so"

          case "$target" in
            *-pc-windows-*)
              lib_prefix=""
              source_ext="dll"
              final_ext="dll"
              ;;
            *-apple-darwin)
              source_ext="dylib"
              final_ext="so"
              ;;
          esac

          source_lib="target/${target}/release/${lib_prefix}sidereon_nif.${source_ext}"
          final_lib="${lib_prefix}sidereon_nif-v${PROJECT_VERSION}-nif-${nif}-${target}.${final_ext}"
          archive="${final_lib}.tar.gz"

          test -f "$source_lib"
          test -f LICENSE
          test -f LICENSES/Apache-2.0.txt
          test -f LICENSES/ERFA-BSD-3-Clause.txt
          test -f LICENSES/IERS-Conventions-Software-License.txt
          test -f LICENSES/ISC-libloading.txt
          test -f LICENSES/SciPy-BSD-3-Clause.txt
          test -f THIRD-PARTY-NOTICES.md
          test -f third_party_source/sidereon-core-0.33.1/tides/mod.rs
          test -f third_party_source/sidereon-core-0.33.1/tides/ocean.rs
          test -f third_party_source/sidereon-core-0.33.1/tides/pole.rs
          rm -f "$final_lib" "$archive"
          cp "$source_lib" "$final_lib"
          tar -czf "$archive" \
            "$final_lib" \
            LICENSE \
            LICENSES/Apache-2.0.txt \
            LICENSES/ERFA-BSD-3-Clause.txt \
            LICENSES/IERS-Conventions-Software-License.txt \
            LICENSES/ISC-libloading.txt \
            LICENSES/SciPy-BSD-3-Clause.txt \
            THIRD-PARTY-NOTICES.md \
            third_party_source/sidereon-core-0.33.1/tides/mod.rs \
            third_party_source/sidereon-core-0.33.1/tides/ocean.rs \
            third_party_source/sidereon-core-0.33.1/tides/pole.rs

          archive_listing="$(tar -tzf "$archive")"
          grep -Fxq "$final_lib" <<<"$archive_listing"
          grep -Fxq "LICENSE" <<<"$archive_listing"
          grep -Fxq "LICENSES/Apache-2.0.txt" <<<"$archive_listing"
          grep -Fxq "LICENSES/ERFA-BSD-3-Clause.txt" <<<"$archive_listing"
          grep -Fxq "LICENSES/IERS-Conventions-Software-License.txt" <<<"$archive_listing"
          grep -Fxq "LICENSES/ISC-libloading.txt" <<<"$archive_listing"
          grep -Fxq "LICENSES/SciPy-BSD-3-Clause.txt" <<<"$archive_listing"
          grep -Fxq "THIRD-PARTY-NOTICES.md" <<<"$archive_listing"
          grep -Fxq "third_party_source/sidereon-core-0.33.1/tides/mod.rs" <<<"$archive_listing"
          grep -Fxq "third_party_source/sidereon-core-0.33.1/tides/ocean.rs" <<<"$archive_listing"
          grep -Fxq "third_party_source/sidereon-core-0.33.1/tides/pole.rs" <<<"$archive_listing"
          test "$(wc -l <<<"$archive_listing" | tr -d ' ')" -eq 11

          if command -v sha256sum >/dev/null 2>&1; then
            sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          else
            sha="$(shasum -a 256 "$archive" | cut -d ' ' -f 1)"
          fi

          echo "file-name=$archive" >> "$GITHUB_OUTPUT"
          echo "file-path=$archive" >> "$GITHUB_OUTPUT"
          echo "file-sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Built $archive"
          echo "SHA256 $sha"

      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package-nif.outputs.file-name }}
          path: ${{ steps.package-nif.outputs.file-path }}

  publish-release-assets:
    name: Publish release assets
    needs: [asset-check, packaged-source-build, precompile]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/') && needs.asset-check.outputs.should-build == 'true'
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Attach archives to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/**/*.tar.gz
