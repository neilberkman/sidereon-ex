name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so the release workflow gates on this exact bar rather than a
  # weaker copy of it. Two lists drift, and the weaker one ends up guarding
  # the irreversible action.
  workflow_call:
    inputs:
      candidate:
        description: "Validate a coordinated prepublication Git-pinned candidate"
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      candidate:
        description: "Validate a coordinated prepublication Git-pinned candidate"
        required: false
        type: boolean
        default: false

jobs:
  # A workflow file can be valid YAML and still be a broken workflow - a
  # branch filter on workflow_call parses fine and then fails the run in 0s
  # with no useful message. Lint the workflows themselves.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pinned upstream binary, not a wrapper action: a wrapper resolves
      # its own Node dependencies out of this repository's root node_modules
      # and dies before it lints anything. Running the same binary the same way
      # locally and in CI is the point.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck= -pyflakes=

  packaged-source-build:
    name: Packaged source-build release gate
    uses: ./.github/workflows/packaged-source-build.yml
    with:
      candidate: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.candidate) && !startsWith(github.ref, 'refs/tags/') }}

  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      SIDEREON_BUILD: "1"
      ASTRODYNAMICS_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19"
            otp: "28"
            os: ubuntu-latest
          - elixir: "1.19"
            otp: "28"
            os: macos-latest
          # Newest-OTP leg: mix.exs declares no OTP ceiling, so CI must test
          # the newest OTP that claim covers (OTP 29 deprecation behavior was
          # first caught locally, never here). Add an OTP 30 leg at first RC.
          - elixir: "1.20"
            otp: "29"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # The NIF is a full Rust workspace build; without a cache every CI run
      # and every release-gate invocation compiles it cold. shared-key lets
      # the tag-triggered release workflow_call reuse push CI's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/sidereon_nif
          shared-key: ci-nif

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-${{ runner.arch }}-deps-${{ hashFiles('mix.lock') }}

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: |
            target
            native/sidereon_nif/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - run: mix test

      - name: Validate the published-consumer contract against the candidate NIF
        if: matrix.os == 'ubuntu-latest' && matrix.elixir == '1.19'
        env:
          SIDEREON_CONSUMER_VERSION: "3.0.2"
        run: mix test .github/scripts/published_hex_consumer_test.exs

      - name: Independent Skyfield parity
        run: mix test --only skyfield_parity

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: mix format --check-formatted
